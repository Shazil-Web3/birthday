                    <div class="balloon_one">

                        <span style="--i: 8;">i</span>

                        <span style="--i: 11;">h</span>

                            <img src="images/unnamed.png" alt="Aamna">

</body>
<script>
    let datetxt = "28 August";
    let charArrDate = datetxt.split('');
    let currentIndex = 0;
    let date__of__birth = document.querySelector(".date__of__birth span");
    setTimeout(function () {
        timeDatetxt = setInterval(function () {
            if (currentIndex < charArrDate.length) {
                date__of__birth.textContent += charArrDate[currentIndex];
                currentIndex++;
            }
            else {
                let i = document.createElement("i");
                i.className = "fa-solid fa-star";
                document.querySelector(".date__of__birth").prepend(i);
                document.querySelector(".date__of__birth").appendChild(i.cloneNode(true));
                clearInterval(timeDatetxt);
            }
        }, 90);
    }, 5500);

    // Letter Modal & Typewriter Controls
    const btnLetter = document.getElementById('btn__letter');
    const boxmail = document.querySelector('.boxMail');
    const closeBtn = document.querySelector('.fa-xmark');
    const card2Content = document.querySelector('.card2-content');
    const birthdayTextElem = document.getElementById('card2-birthday-text');

    const fullBirthdayMessage = "Happy birthday 🥳🎂🎈 Aamna! Wishing you a wonderful day filled with happiness, love, and laughter. May this new year of your life bring you endless joy, great health, and tremendous success in everything you do. May all your dreams and aspirations come true, and may you always keep smiling and shining bright. Have a truly blessed and amazing birthday! ✨🎉💖";

    let typewriterInterval = null;

    function startTypewriter() {
        clearInterval(typewriterInterval);
        if (birthdayTextElem) {
            birthdayTextElem.textContent = "";
        }
        let charIdx = 0;
        const msgChars = fullBirthdayMessage.split('');
        
        typewriterInterval = setInterval(() => {
            if (charIdx < msgChars.length) {
                if (birthdayTextElem) {
                    birthdayTextElem.textContent += msgChars[charIdx];
                }
                charIdx++;
                if (card2Content) {
                    card2Content.scrollTop = card2Content.scrollHeight;
                }
            } else {
                clearInterval(typewriterInterval);
            }
        }, 25);
    }

    function openEnvelope() {
        if (boxmail) {
            boxmail.classList.add('active');
        }
        playAudio();
        // Start automatic typing text after envelope opens
        setTimeout(() => {
            startTypewriter();
        }, 400);
    }

    function closeEnvelope() {
        if (boxmail) {
            boxmail.classList.remove('active');
        }
        clearInterval(typewriterInterval);
    }

    if (btnLetter) {
        btnLetter.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            openEnvelope();
        });
    }

    if (closeBtn) {
        closeBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            closeEnvelope();
        });
    }

    if (boxmail) {
        boxmail.addEventListener('click', function (e) {
            if (e.target === boxmail) {
                closeEnvelope();
            }
        });
    }

    if (card2Content) {
        card2Content.addEventListener('click', function () {
            if (birthdayTextElem && birthdayTextElem.textContent.length < fullBirthdayMessage.length) {
                clearInterval(typewriterInterval);
                birthdayTextElem.textContent = fullBirthdayMessage;
            }
        });
    }

    // Background Birthday Music Controls
    const bgMusic = document.getElementById('bgMusic');
    const musicToggle = document.getElementById('musicToggle');
    let isPlaying = false;

    if (bgMusic) {
        bgMusic.addEventListener('play', function () {
            isPlaying = true;
            if (musicToggle) musicToggle.classList.add('playing');
            removeAutoPlayListeners();
        });

        bgMusic.addEventListener('pause', function () {
            isPlaying = false;
            if (musicToggle) musicToggle.classList.remove('playing');
        });
    }

    function playAudio() {
        if (bgMusic && bgMusic.paused) {
            bgMusic.muted = false;
            const playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    isPlaying = true;
                    if (musicToggle) musicToggle.classList.add('playing');
                    removeAutoPlayListeners();
                }).catch(() => {
                    // Browser prevented audio before gesture; waiting for first interaction
                });
            }
        }
    }

    function toggleAudio() {
        if (bgMusic) {
            if (!bgMusic.paused) {
                bgMusic.pause();
            } else {
                playAudio();
            }
        }
    }

    if (musicToggle) {
        musicToggle.addEventListener('click', function (e) {
            e.stopPropagation();
            toggleAudio();
        });
    }

    const unlockEvents = ['click', 'pointerdown', 'touchstart', 'touchend', 'mousedown', 'keydown'];
    function onFirstUserGesture() {
        playAudio();
    }

    function removeAutoPlayListeners() {
        unlockEvents.forEach(evt => {
            window.removeEventListener(evt, onFirstUserGesture, true);
            document.removeEventListener(evt, onFirstUserGesture, true);
        });
    }

    unlockEvents.forEach(evt => {
        window.addEventListener(evt, onFirstUserGesture, true);
        document.addEventListener(evt, onFirstUserGesture, true);
    });

    // Start audio automatically when website opens
    playAudio();
    document.addEventListener('DOMContentLoaded', playAudio);
    window.addEventListener('load', playAudio);
    setTimeout(playAudio, 300);
</script>

</html>
